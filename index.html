const pages={home:'首頁',about:'關於我',works:'藝術作品',books:'生命書寫',workshops:'工作坊',projects:'展覽紀錄',commercial:'商業接案',shop:'商店',contact:'聯絡與合作'};
let site=null;const seriesData={};const esc=v=>String(v??"").replace(/[&<>"\x27]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","\x27":"&#39;"}[c]));const img=v=>esc(String(v||"").replace(/^\/images\//,"images/"));const paintings=()=>(seriesData[0]?.artworks??site?.artworks)?.filter(a=>a.visible!==false)||islandImages.map((image,i)=>({image,title:i===0?"東吉燈塔":""}));
function art(i){if(seriesData[i]?.cover)return `<img class="island-cover" src="${img(seriesData[i].cover)}" alt="系列封面">`;if(i===0)return `<img class="island-cover" src="${img(paintings()[0]?.image||islandImages[0])}" alt="島嶼日常系列原作：東吉燈塔">`;let b='';if(i===0)b='<rect width="600" height="400" fill="#e4c7a4"/><circle cx="410" cy="105" r="42" fill="#fff0c4"/><path d="M0 180Q160 150 300 180T600 170V400H0Z" fill="#668e99"/><path d="M0 250Q160 205 300 250T600 230V400H0Z" fill="#426d80"/><path d="M0 320Q160 270 300 320T600 300V400H0Z" fill="#24465b"/><path d="M340 200H480M370 225H450M320 260H490M350 295H470" stroke="#e9c49c" stroke-width="6" opacity=".7"/>';if(i===1){b='<rect width="600" height="400" fill="#234b73"/>';for(let k=0;k<8;k++){b+=`<g transform="translate(300 200) rotate(${k*45})" fill="#dce8df"><path d="M0 0Q-20 -80 0 -170" stroke="#dce8df" fill="none" stroke-width="2"/>`;for(let j=1;j<7;j++)b+=`<ellipse cx="-14" cy="${-j*23}" rx="8" ry="22" transform="rotate(-45 -14 ${-j*23})"/><ellipse cx="14" cy="${-j*23}" rx="8" ry="22" transform="rotate(45 14 ${-j*23})"/>`;b+='</g>'}}if(i===2)b='<rect width="600" height="400" fill="#dfc5a2"/><path d="M0 0H230L350 210 190 400H0Z" fill="#ad8763"/><path d="M600 80V400H250L350 270Z" fill="#a66f50"/><circle cx="340" cy="190" r="105" fill="none" stroke="#f1dfbf" stroke-width="17"/>';if(i===3){b='<rect width="600" height="400" fill="#c6c8a0"/><path d="M0 240L120 80 220 200 330 50 500 160 600 80V400H0Z" fill="#778d68"/><path d="M0 270Q180 140 300 260T600 200V400H0Z" fill="#456e58"/>';for(let k=0;k<9;k++)b+=`<path d="M${k*76} 400L${k*76+12} 90" stroke="#425c48" stroke-width="9"/><ellipse cx="${k*76+12}" cy="${90+k%3*30}" rx="65" ry="43" fill="#557c58"/>`;}return `<svg viewBox="0 0 600 400" preserveAspectRatio="xMidYMid slice" role="img" aria-label="示意藝術圖像">${b}</svg>`}
const head=(e,t)=>`<small>${e}</small><h2>${t}</h2>`,entry=(t,d)=>`<div class="entry"><h3>${t}</h3><p>${d}</p></div>`,btn=(p,t)=>`<a class="button" href="#${p}">${t==="上一幅"?"← "+t:t+" →"}</a>`,gallery=()=>`<div class="grid">${works.map((w,i)=>`<a class="tile" href="#work${i}">${art(i)}<h3>${w[0]}</h3><small>${w[1]}</small></a>`).join('')}</div>`;
document.querySelector('#nav').innerHTML=Object.entries(pages).map(([k,v])=>`<a href="#${k}">${v}</a>`).join('');

let shopProducts=[],postcardCover='',cart={};try{cart=JSON.parse(localStorage.getItem('malaika-cart')||'{}')||{}}catch(e){}
const available=p=>p.status==='販售中'&&(p.stock==null||p.stock>0);
const shopList=()=>shopProducts.filter(p=>p.status!=='下架');
function changeCart(id,delta){const p=shopProducts.find(p=>p.id===id);if(!p)return;let n=Math.max(0,(Number(cart[id])||0)+delta);if(delta>0&&(!available(p)||n>(p.stock??999)))return;if(n)cart[id]=n;else delete cart[id];try{localStorage.setItem('malaika-cart',JSON.stringify(cart))}catch(e){}render();}
const cartCount=()=>shopList().reduce((n,p)=>n+(Number(cart[p.id])||0),0);
const cartLink=()=>btn('cart','購物車（'+cartCount()+'）');
const shopPhoto=p=>p.images?.[0]?'<img loading="lazy" style="width:100%;aspect-ratio:1.2;object-fit:contain" src="'+img(p.images[0])+'" alt="'+esc(p.title)+'">':'<div class="entry">商品照片待上傳</div>';
const shopButton=p=>available(p)?'<button class="button" data-add="'+esc(p.id)+'">加入購物車</button>':'<p>暫無庫存</p>';
const categoryTitle=c=>c==='澎湖12片海 明信片'?'澎湖的12片海 明信片':c;
const categoryRoute=c=>'shop-category-'+encodeURIComponent(c);
function shopPage(){const categories=[...new Set(shopList().map(p=>p.category||'其他商品'))];return '<section>'+head('SHOP','把藝術帶回生活')+cartLink()+'<div class="grid">'+categories.map(c=>{const p=shopList().find(p=>(p.category||'其他商品')===c);return '<a class="tile" href="#'+categoryRoute(c)+'"><h3>'+esc(categoryTitle(c))+'</h3>'+(c==='澎湖12片海 明信片'?'<img style="width:100%;height:auto;display:block" src="'+img(postcardCover||p.images?.[0]||'')+'" alt="澎湖的12片海 明信片" onerror="this.onerror=null;this.src='+esc(JSON.stringify(p.images?.[0]||''))+'">':shopPhoto(p))+'<p>瀏覽系列 →</p></a>'}).join('')+'</div></section>'}
function categoryPage(c){return '<section>'+btn('shop','返回商店')+' '+cartLink()+head('COLLECTION',esc(categoryTitle(c)))+'<div class="grid">'+shopList().filter(p=>(p.category||'其他商品')===c).map(p=>'<article><a href="#product-'+encodeURIComponent(p.id)+'">'+shopPhoto(p)+'<h3>'+esc(p.title)+'</h3></a><p>NT$ '+esc(p.price)+'</p>'+shopButton(p)+'</article>').join('')+'</div></section>'}
function productNav(p){const list=shopList().filter(x=>x.category===p.category),i=list.findIndex(x=>x.id===p.id);const link=(x,label)=>x?'<a class="button" href="#product-'+encodeURIComponent(x.id)+'">'+label+'</a>':'<span aria-disabled="true" style="opacity:.35">'+label+'</span>';return '<nav aria-label="商品切換" style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin:24px 0">'+link(list[i-1],'← 上一件')+'<span style="font-size:.9em">'+(i+1)+' / '+list.length+'</span>'+link(list[i+1],'下一件 →')+'</nav>'}
function productPage(id){const p=shopList().find(p=>p.id===id);if(!p)return shopPage();return '<section>'+btn(categoryRoute(p.category||'其他商品'),'返回商品系列')+' '+cartLink()+productNav(p)+'<div class="hero">'+shopPhoto(p)+'</div>'+ (p.images||[]).slice(1).map(x=>'<img style="max-width:100%" src="'+img(x)+'" alt="'+esc(p.title)+'">').join('')+'<h2>'+esc(p.title)+'</h2><p>'+esc(p.description)+'</p>'+[['尺寸',p.size],['材質',p.medium],['紙質',p.paper]].filter(x=>x[1]).map(x=>'<p>'+x[0]+'：'+esc(x[1])+'</p>').join('')+'<h3>NT$ '+esc(p.price)+'</h3>'+shopButton(p)+productNav(p)+'</section>'}
function cartPage(){const items=shopList().filter(p=>cart[p.id]>0),subtotal=items.reduce((n,p)=>n+p.price*cart[p.id],0);return '<section>'+head('CART','購物車')+btn('shop','繼續購物')+(items.length?items.map(p=>'<div class="entry"><h3>'+esc(p.title)+'</h3><p>NT$ '+esc(p.price)+' × '+esc(cart[p.id])+'</p><button class="button" data-minus="'+esc(p.id)+'">−</button> <button class="button" data-add="'+esc(p.id)+'">＋</button></div>').join('')+'<p>商品小計：NT$ '+subtotal+'</p><p>運費：NT$ 60</p><h3>合計：NT$ '+(subtotal+60)+'</h3><button class="button" disabled>綠界結帳（尚未開通）</button><p>目前尚未開放付款，購物車不會成立訂單。</p>':'<p>購物車目前沒有商品。</p>')+'</section>'}
document.addEventListener('click',e=>{const b=e.target.closest('[data-add],[data-minus]');if(b)changeCart(b.dataset.add||b.dataset.minus,b.dataset.add?1:-1)});

function render(){let p=location.hash.slice(1)||'home',s='';if(p==='home')s=`<section class="hero"><img src="${img(site?.banner||homeBanner)}" alt="島嶼與潮間帶步道的油畫棒作品" style="display:block;width:100%;height:auto"></section><section class="intro"><small>ART · LAND · LIFE</small><h1>${esc(site?.title||"在世界裡旅行，\n在生活裡生長。").replace(/\n/g,"<br>")}</h1><p>${esc(site?.intro||"我是 Malaika（柔安），一位透過藝術探索世界、土地與生命的創作者。")}</p>${btn('works','探索我的創作')}</section><section>${head('SELECTED WORKS','創作的風景')}${gallery()}</section><section class="story"><h2>從世界走向一座島，<br>從一座島走向自己。</h2>${btn('about','閱讀我的故事')}</section><section>${head('CREATE TOGETHER','藝術與生活的交會')}${btn('books','生命書寫')} ${btn('workshops','一起創作')} ${btn('commercial','商業接案')}</section>`;
else if(p==='work0')s=`<section>${btn('works','返回作品集')}${head('ISLAND LANDSCAPES','島嶼日常')}<p>${esc(seriesData[0]?.description??"以油畫棒與插畫記錄海洋、漁村與日常光景。")}</p><div class="island-grid">${paintings().map((a,i)=>`<button class="painting" onclick="location.hash='painting${i}'" aria-label="放大欣賞作品 ${i+1}"><img src="${img(a.image)}" alt="${esc(a.title||`島嶼日常作品 ${i+1}`)}" loading="lazy"><span>${esc(a.title||String(i+1).padStart(2,'0'))}</span></button>`).join('')}</div>${btn('contact','作品詢問')}</section>`;
else if(/^series[1-3]-\d+$/.test(p)){let [k,j]=p.slice(6).split('-').map(Number),a=seriesData[k]?.artworks?.filter(x=>x.visible!==false)[j];if(!a){location.hash='work'+k;return}s=`<section>${btn('work'+k,'返回作品集')}<div class="hero"><img style="width:100%;max-height:70vh;object-fit:contain" src="${img(a.image)}"></div><h2>${esc(a.title||'藝術作品')}</h2><p>${esc(a.english)}</p>${[['媒材',a.medium],['尺寸',a.size],['年份',a.year],['收藏與租借狀態',a.status],['售價',a.price],['租金',a.rent],['租借說明',a.rentalNote],['作品介紹',a.description]].filter(x=>x[1]).map(x=>`<p>${x[0]}：${esc(x[1])}</p>`).join('')}${btn('contact','作品洽詢')} ${j>0?btn('series'+k+'-'+(j-1),'上一幅'):''} ${j+1<(seriesData[k]?.artworks||[]).filter(x=>x.visible!==false).length?btn('series'+k+'-'+(j+1),'下一幅'):''}</section>`;}
else if(/^painting\d+$/.test(p)){let i=+p.slice(8),a=paintings()[i];if(!a){location.hash='work0';return}s=`<section>${btn('work0','返回島嶼日常')}<div class="hero"><img style="display:block;width:100%;max-height:70vh;object-fit:contain" src="${img(a.image)}" alt="${esc(a.title||'藝術作品')}"></div><h2>${esc(a.title||'島嶼日常作品 '+(i+1))}</h2><p>${esc(a.english)}</p>${[['創作媒材',a.medium],['作品尺寸',a.size],['創作年份',a.year],['收藏與租借狀態',Array.isArray(a.status)?a.status.join(' · '):a.status],['售價',a.price],['租金',a.rent],['租借說明',a.rentalNote]].filter(x=>x[1]).map(x=>`<p><strong>${x[0]}：</strong>${esc(x[1])}</p>`).join('')}${a.description?`<h3>作品介紹</h3><p style="white-space:pre-wrap">${esc(a.description)}</p>`:''}${btn('contact','作品洽詢')} ${i>0?btn('painting'+(i-1),'上一幅'):''} ${i+1<paintings().length?btn('painting'+(i+1),'下一幅'):''}</section>`;}
else if(/^work[0-3]$/.test(p)){let i=+p.slice(-1),w=works[i];s=`<section>${btn('works','返回作品集')}${head(w[1],w[0])}<p>${esc(seriesData[i]?.description??w[2])}</p><div class="island-grid">${(seriesData[i]?.artworks||[]).filter(a=>a.visible!==false).map((a,j)=>`<a class="painting" href="#series${i}-${j}"><img src="${img(a.image)}" alt="${esc(a.title)}"><span>${esc(a.title||"藝術作品")}</span></a>`).join("")}</div>${btn('contact','作品詢問')}</section>`}
else if(p==='works')s=`<section>${head('PORTFOLIO','藝術作品')}${gallery()}</section>`;
else if(p==='about')s=`<section>${head('ABOUT MALAIKA','關於柔安')}<h1>旅行是起點，<br>生活是創作。</h1><p>我是一位插畫家、圖文書作者與藝術創作者。曾經擔任國小老師，也曾在公部門工作。大學畢業後，我開始帶著畫筆旅行，記錄世界各地的風景與文化。</p><p>後來在澎湖生活多年，創作逐漸從向外探索世界，轉向對土地、日常與自身生命的理解。</p><div class="hero">${art(0)}</div>${btn('contact','與我合作')}</section>`;
else if(p==='books')s=`<section>${head('WRITING','生命書寫')}${entry('我沒錢，所以邊畫畫邊旅行','2020 年出版 · 作者')}${entry('西嶼輪普——歡迎光臨人間旅行社','已出版 · 插畫繪者')}${entry('那些旅行不曾教會我的，澎湖教會了','籌備中 · 暫定書名')}${entry('婆羅洲本南族田野圖文計畫','籌備中 · 雨林、文化與生活智慧。')}</section>`;
else if(p==='workshops')s=`<section>${head('WORKSHOPS','藝術工作坊')}<div class="grid"><div>${art(1)}${entry('藍曬','與陽光、植物共同創作。')}</div><div>${art(2)}${entry('礦物染','探索土地的色彩。')}</div></div>${entry('藝術與自由書寫','透過藝術進行自我探索。')}${btn('contact','課程邀約')}</section>`;
else if(p==='projects')s=`<section>${head('EXHIBITIONS','展覽紀錄')}${entry('澎湖的房間','油畫棒、生命書寫與空間裝置。')}${entry('大風吹生活節 × 藍手起家創作展','藍曬與地方生活。')}</section>`;
else if(p==='commercial')s=`<section>${head('COMMERCIAL PORTFOLIO','商業接案')}<p>透過插畫與視覺創作，將不同品牌、地方文化與故事轉化為圖像。</p><div class="grid">${['書籍與出版插畫','地方文化與視覺設計','品牌與客製插畫'].map(t=>`<div class="entry"><small>PORTFOLIO</small><h3>${t}</h3><p>正式案例與作品照片待補充。</p></div>`).join('')}</div>${btn('contact','商業合作邀約')}</section>`;
else if(p==='shop')s=shopPage();
else if(p.startsWith('shop-category-'))s=categoryPage(decodeURIComponent(p.slice(14)));
else if(p==='cart')s=cartPage();
else if(p.startsWith('product-'))s=productPage(decodeURIComponent(p.slice(8)));
else if(p==='contact')s=`<section>${head('CONTACT','讓我們一起創造')}<p>歡迎插畫委託、出版合作、展覽邀請及工作坊邀約。</p><form id="form"><label>姓名或單位<input required name="name"></label><label>Email<input required type="email" name="email"></label><label>合作內容<textarea required rows="5" name="message"></textarea></label><button class="button">預覽訊息</button></form><p id="result" role="status"></p><p class="note">試用表單不會傳送或儲存資料。</p></section>`;
else {location.hash='home';return}document.querySelector('#main').innerHTML=s;if(/^(painting\d+|series[1-3]-\d+)$/.test(p))setupArtworkZoom(document.querySelector('#main .hero img'));let f=document.querySelector('#form');if(f)f.onsubmit=e=>{e.preventDefault();document.querySelector('#result').textContent='預覽完成，尚未連接寄信服務。'};window.scrollTo(0,0)}
let currentPainting=0;function showPainting(i){currentPainting=(i+islandImages.length)%islandImages.length;document.getElementById('largePainting').src=islandImages[currentPainting];document.getElementById('counter').textContent=(currentPainting+1)+' / '+islandImages.length;let d=document.getElementById('viewer');if(!d.open)d.showModal();}document.addEventListener('keydown',e=>{if(document.getElementById('viewer').open){if(e.key==='ArrowLeft')showPainting(currentPainting-1);if(e.key==='ArrowRight')showPainting(currentPainting+1);}});window.addEventListener('hashchange',render);render();fetch('data/site.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw Error('data');return r.json()}).then(d=>{site=d;render()}).catch(()=>{});

function setupArtworkZoom(image){
 if(!image)return;
 const hero=image.parentElement;
 const frame=document.createElement('div');
 frame.style.cssText='position:relative;display:inline-block;max-width:100%;vertical-align:top;line-height:0;';
 hero.style.textAlign='center';
 hero.insertBefore(frame,image);frame.appendChild(image);
 image.style.cssText='display:block;width:auto;height:auto;max-width:100%;max-height:70vh;object-fit:contain;cursor:zoom-in;';
 const lens=document.createElement('div');
 lens.setAttribute('aria-hidden','true');
 lens.style.cssText='display:none;position:absolute;pointer-events:none;border-radius:50%;border:2px solid white;box-shadow:0 2px 12px #0005;z-index:2;background-repeat:no-repeat;box-sizing:border-box;';
 frame.appendChild(lens);
 const hint=document.createElement('p');hint.style.cssText='font-size:.85rem;text-align:center;margin:.6rem 0;color:inherit;';hint.textContent='⌕ 移動游標查看細節・觸控螢幕可點按放大';hero.after(hint);
 function hide(){lens.style.display='none';}
 function move(e){
  if(e.pointerType==='touch')return;
  const r=image.getBoundingClientRect();if(!image.complete||!image.naturalWidth||!r.width||!r.height)return;
  const x=e.clientX-r.left,y=e.clientY-r.top;if(x<0||y<0||x>r.width||y>r.height){hide();return;}
  const size=Math.min(180,r.width,r.height),z=2.5;
  const lx=Math.max(0,Math.min(r.width-size,x-size/2)),ly=Math.max(0,Math.min(r.height-size,y-size/2));
  lens.style.width=lens.style.height=size+'px';lens.style.left=lx+'px';lens.style.top=ly+'px';
  lens.style.backgroundImage='url('+JSON.stringify(image.currentSrc||image.src)+')';
  lens.style.backgroundSize=r.width*z+'px '+r.height*z+'px';
  lens.style.backgroundPosition=(size/2-x*z)+'px '+(size/2-y*z)+'px';lens.style.display='block';
 }
 image.addEventListener('pointermove',move);image.addEventListener('pointerleave',hide);
 image.addEventListener('pointercancel',hide);
 image.addEventListener('click',()=>{if(!matchMedia('(hover: none), (pointer: coarse)').matches)return;
  const d=document.createElement('dialog');d.style.cssText='padding:12px;max-width:96vw;max-height:94vh;overflow:auto;border:0;background:#fff;';
  const close=document.createElement('button');close.textContent='關閉 ×';close.style.cssText='position:sticky;top:0;display:block;margin:0 0 8px auto;z-index:1;';
  const full=document.createElement('img');full.src=image.currentSrc||image.src;full.alt=image.alt;full.style.cssText='display:block;width:200vw;max-width:none;height:auto;';
  d.append(close,full);document.body.appendChild(d);close.onclick=()=>d.close();d.addEventListener('close',()=>d.remove(),{once:true});d.showModal();
 });
}

backend:
  name: turbo-github
  turbo_site_id: a8916549-76d0-404d-8398-a18eedb16988
locale: zh_Hant
media_folder: images
public_folder: images
collections:
  - name: website
    label: 首頁管理
    files:
      - name: home
        label: 編輯首頁
        file: data/site.json
        fields:
          - {label: 首頁封面, name: banner, widget: image}
          - {label: 首頁標題, name: title, widget: text}
          - {label: 首頁介紹, name: intro, widget: text}
  - name: series0
    label: 島嶼日常
    files:
      - name: series0
        label: 編輯系列與作品
        file: data/series-0.json
        fields:
          - {label: 系列封面, name: cover, widget: image, required: false}
          - {label: 系列介紹, name: description, widget: text, required: false}
          - label: 藝術作品
            name: artworks
            widget: list
            required: false
            fields:
              - {label: 作品圖片, name: image, widget: image}
              - {label: 作品名稱, name: title, widget: string, required: false}
              - {label: 英文名稱, name: english, widget: string, required: false}
              - {label: 媒材, name: medium, widget: string, required: false}
              - {label: 尺寸, name: size, widget: string, required: false}
              - {label: 年份, name: year, widget: string, required: false}
              - {label: 作品介紹, name: description, widget: text, required: false}
              - {label: 收藏與租借狀態, name: status, widget: select, multiple: true, required: false, options: [可收藏, 可出租, 已售出, 出租中, 非賣品]}
              - {label: 售價, name: price, widget: string, required: false}
              - {label: 租金, name: rent, widget: string, required: false}
              - {label: 租借說明, name: rentalNote, widget: text, required: false}
              - {label: 公開展示, name: visible, widget: boolean, default: true}
  - name: series1
    label: 與陽光共同創作（藍曬）
    files:
      - name: series1
        label: 編輯系列與作品
        file: data/series-1.json
        fields:
          - {label: 系列封面, name: cover, widget: image, required: false}
          - {label: 系列介紹, name: description, widget: text, required: false}
          - label: 藝術作品
            name: artworks
            widget: list
            required: false
            fields:
              - {label: 作品圖片, name: image, widget: image}
              - {label: 作品名稱, name: title, widget: string, required: false}
              - {label: 英文名稱, name: english, widget: string, required: false}
              - {label: 媒材, name: medium, widget: string, required: false}
              - {label: 尺寸, name: size, widget: string, required: false}
              - {label: 年份, name: year, widget: string, required: false}
              - {label: 作品介紹, name: description, widget: text, required: false}
              - {label: 收藏與租借狀態, name: status, widget: select, multiple: true, required: false, options: [可收藏, 可出租, 已售出, 出租中, 非賣品]}
              - {label: 售價, name: price, widget: string, required: false}
              - {label: 租金, name: rent, widget: string, required: false}
              - {label: 租借說明, name: rentalNote, widget: text, required: false}
              - {label: 公開展示, name: visible, widget: boolean, default: true}
  - name: series2
    label: 土地的顏色（礦物染）
    files:
      - name: series2
        label: 編輯系列與作品
        file: data/series-2.json
        fields:
          - {label: 系列封面, name: cover, widget: image, required: false}
          - {label: 系列介紹, name: description, widget: text, required: false}
          - label: 藝術作品
            name: artworks
            widget: list
            required: false
            fields:
              - {label: 作品圖片, name: image, widget: image}
              - {label: 作品名稱, name: title, widget: string, required: false}
              - {label: 英文名稱, name: english, widget: string, required: false}
              - {label: 媒材, name: medium, widget: string, required: false}
              - {label: 尺寸, name: size, widget: string, required: false}
              - {label: 年份, name: year, widget: string, required: false}
              - {label: 作品介紹, name: description, widget: text, required: false}
              - {label: 收藏與租借狀態, name: status, widget: select, multiple: true, required: false, options: [可收藏, 可出租, 已售出, 出租中, 非賣品]}
              - {label: 售價, name: price, widget: string, required: false}
              - {label: 租金, name: rent, widget: string, required: false}
              - {label: 租借說明, name: rentalNote, widget: text, required: false}
              - {label: 公開展示, name: visible, widget: boolean, default: true}
  - name: series3
    label: 雨林裡的生活智慧
    files:
      - name: series3
        label: 編輯系列與作品
        file: data/series-3.json
        fields:
          - {label: 系列封面, name: cover, widget: image, required: false}
          - {label: 系列介紹, name: description, widget: text, required: false}
          - label: 藝術作品
            name: artworks
            widget: list
            required: false
            fields:
              - {label: 作品圖片, name: image, widget: image}
              - {label: 作品名稱, name: title, widget: string, required: false}
              - {label: 英文名稱, name: english, widget: string, required: false}
              - {label: 媒材, name: medium, widget: string, required: false}
              - {label: 尺寸, name: size, widget: string, required: false}
              - {label: 年份, name: year, widget: string, required: false}
              - {label: 作品介紹, name: description, widget: text, required: false}
              - {label: 收藏與租借狀態, name: status, widget: select, multiple: true, required: false, options: [可收藏, 可出租, 已售出, 出租中, 非賣品]}
              - {label: 售價, name: price, widget: string, required: false}
              - {label: 租金, name: rent, widget: string, required: false}
              - {label: 租借說明, name: rentalNote, widget: text, required: false}
              - {label: 公開展示, name: visible, widget: boolean, default: true}

  - name: shop
    label: 商店商品管理
    files:
      - name: postcards
        label: 澎湖的12片海 明信片
        file: data/shop.json
        fields:
          - {label: 系列封面, name: postcardCover, widget: image, required: false}
          - {label: 系列介紹, name: description, widget: text, required: false}
          - label: 商品
            name: products
            widget: list
            fields:
              - {label: 商品編號（不可重複）, name: id, widget: string}
              - {label: 商品名稱, name: title, widget: string}
              - {label: 英文名稱, name: english, widget: string, required: false}
              - label: 商品照片
                name: images
                widget: list
                required: false
                field: {label: 圖片, name: image, widget: image}
              - {label: 商品介紹, name: description, widget: text, required: false}
              - {label: 尺寸, name: size, widget: string, required: false}
              - {label: 材質與媒材, name: medium, widget: string, required: false}
              - {label: 紙質, name: paper, widget: string, required: false}
              - {label: 售價（元）, name: price, widget: number, value_type: int, min: 0}
              - {label: 庫存, name: stock, widget: number, value_type: int, min: 0, required: false}
              - {label: 販售狀態, name: status, widget: select, options: [販售中, 售完, 下架]}
      - name: calendar2027
        label: 2027月曆
        file: data/shop-calendar.json
        fields:
          - {label: 系列封面, name: cover, widget: image, required: false}
          - {label: 系列介紹, name: description, widget: text, required: false}
          - label: 商品
            name: products
            widget: list
            fields:
              - {label: 商品編號（不可重複）, name: id, widget: string}
              - {label: 商品名稱, name: title, widget: string}
              - {label: 英文名稱, name: english, widget: string, required: false}
              - {label: 月曆封面, name: calendarCover, widget: image, required: false}
              - {label: 1月圖片, name: month1, widget: image, required: false}
              - {label: 2月圖片, name: month2, widget: image, required: false}
              - {label: 3月圖片, name: month3, widget: image, required: false}
              - {label: 4月圖片, name: month4, widget: image, required: false}
              - {label: 5月圖片, name: month5, widget: image, required: false}
              - {label: 6月圖片, name: month6, widget: image, required: false}
              - {label: 7月圖片, name: month7, widget: image, required: false}
              - {label: 8月圖片, name: month8, widget: image, required: false}
              - {label: 9月圖片, name: month9, widget: image, required: false}
              - {label: 10月圖片, name: month10, widget: image, required: false}
              - {label: 11月圖片, name: month11, widget: image, required: false}
              - {label: 12月圖片, name: month12, widget: image, required: false}
              - label: 其他商品照片
                name: images
                widget: list
                required: false
                field: {label: 圖片, name: image, widget: image}
              - {label: 商品介紹, name: description, widget: text, required: false}
              - {label: 尺寸, name: size, widget: string, required: false}
              - {label: 材質與媒材, name: medium, widget: string, required: false}
              - {label: 裝訂方式, name: binding, widget: string, required: false}
              - {label: 優惠售價（元）, name: salePrice, widget: number, value_type: int, min: 1, required: false}
              - {label: 紙質, name: paper, widget: string, required: false}
              - {label: 售價（元）, name: price, widget: number, value_type: int, min: 0}
              - {label: 庫存, name: stock, widget: number, value_type: int, min: 0, required: false}
              - {label: 販售狀態, name: status, widget: select, options: [販售中, 售完, 下架]}
